name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
      - name: Static validation
        run: ./scripts/validate.sh
