apiVersion: v1
kind: ConfigMap
metadata: {name: nginx-conf, namespace: dojo-04-tls}
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location /health { return 200 "PLAIN-HTTP\\n"; }
      }
      server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        location /health { return 200 "TLS-OK\\n"; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tls-server, namespace: dojo-04-tls}
spec:
  replicas: 1
  selector: {matchLabels: {app: tls-server}}
  template:
    metadata: {labels: {app: tls-server}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
          ports: [{name: http, containerPort: 8080}, {name: https, containerPort: 8443}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: nginx-conf}
        - name: tls
          secret: {secretName: tls}
---
apiVersion: v1
kind: Service
metadata: {name: tls-server, namespace: dojo-04-tls}
spec:
  selector: {app: tls-server}
  ports: [{name: https, port: 443, targetPort: 8080}]
