apiVersion: v1
kind: Namespace
metadata:
  name: dojo-05-ingress
  labels: {debug-dojo: "true"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-05-ingress}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: app, image: debug-dojo-java:local, imagePullPolicy: IfNotPresent, ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-05-ingress}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: api, namespace: dojo-05-ingress}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /dojo
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8081}}
