apiVersion: v1
kind: Namespace
metadata:
  name: dojo-11-storage
  labels: {debug-dojo: "true"}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: dojo-11-storage}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: writer, namespace: dojo-11-storage}
spec:
  replicas: 1
  selector: {matchLabels: {app: writer}}
  template:
    metadata: {labels: {app: writer}}
    spec:
      initContainers:
        - name: prepare-volume
          image: busybox:1.37
          command: ["sh","-c","chmod 0555 /data && ls -ld /data"]
          securityContext: {runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: app
          image: debug-dojo-java:local
          imagePullPolicy: IfNotPresent
          env: [{name: DOJO_MODE, value: writer}, {name: WRITE_PATH, value: /data/dojo.txt}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
