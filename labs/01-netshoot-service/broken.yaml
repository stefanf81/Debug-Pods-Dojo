apiVersion: v1
kind: Namespace
metadata:
  name: dojo-01-service
  labels: {debug-dojo: "true"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-01-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: app
          image: debug-dojo-java:local
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 2, timeoutSeconds: 3}
          ports: [{name: http, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-01-service}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: 8081}]
