apiVersion: v1
kind: Namespace
metadata:
  name: dojo-10-arthas-slow
  labels: {debug-dojo: "true"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-10-arthas-slow}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      volumes: [{name: shared-tmp, emptyDir: {}}]
      containers:
        - name: app
          image: debug-dojo-java:local
          imagePullPolicy: IfNotPresent
          env: [{name: SLOW_MS, value: "4000"}]
          volumeMounts: [{name: shared-tmp, mountPath: /tmp}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-10-arthas-slow}
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
